# Escuchar los logs del puente de WhatsApp — sin abrir una terminal.
#
# Existe porque llevamos tres rondas de diagnóstico deduciendo causas desde
# contadores (`arranquesContenedor`, `latidos`) cuando el sistema tiene una
# fuente que las dice en texto. El puente ya trae `[observability] enabled`;
# lo que faltaba era una forma de leer eso sin terminal y sin dashboard.
#
# Vuelca lo que diga el Worker Y el contenedor —`console.log` de servidor.mjs
# incluido— al registro de la pestaña Actions, que cualquiera puede leer y
# pegar.
#
# Solo LEE. No despliega, no reinicia, no toca credenciales.
#
# La prueba que importa se hace con el panel del CRM CERRADO: si la tarjeta
# está abierta, su sondeo cada 5 s mantiene vivo el contenedor y la caída que
# buscamos no ocurre.
name: Ver los logs del puente

on:
  workflow_dispatch:
    inputs:
      segundos:
        description: "¿Cuántos segundos escuchar? (el contenedor se cae cada ~2 min)"
        type: choice
        default: "180"
        options:
          - "120"
          - "180"
          - "300"

concurrency:
  group: ver-logs-puente

# La misma versión clavada que despliega el puente (puente-wa.yml). `@4` trae
# lo último que publiquen, y una publicación de Cloudflare ya tumbó el deploy
# una vez: un diagnóstico no puede depender de eso.
env:
  WRANGLER: "4.132.0"

jobs:
  escuchar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puente-wa
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Escuchar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          SEG="${{ inputs.segundos }}"
          [ -n "$SEG" ] || SEG=180
          echo "Escuchando $SEG segundos. El nombre del Worker sale de wrangler.toml."
          echo "Si el contenedor se apaga en esta ventana, la causa queda escrita abajo."
          echo "────────────────────────────────────────────────────────────"
          # `tail` no termina solo: se corta por tiempo. El `|| true` evita que
          # ese corte —que es lo esperado— marque la corrida en rojo.
          timeout --preserve-status "$SEG" npx wrangler@$WRANGLER tail --format pretty || true
          echo "────────────────────────────────────────────────────────────"
          echo "Fin de la escucha."
