# Publica el CLI `juancitoads` a npm, con PROCEDENCIA (provenance) cuando se puede.
#
# Provenance = npm firma el paquete con Sigstore y deja constancia pública de
# QUÉ commit de ESTE repo lo construyó. En npmjs.com aparece el badge
# "Provenance" enlazando al commit y a la corrida que lo publicó.
#
# ── Dos formas de autenticarse, y el workflow acepta las dos ────────────────
#
# B · Token en GitHub Secrets — obligatorio para el PRIMER publish. La
#     configuración de Trusted Publisher vive DENTRO del paquete, y npm exige
#     que el paquete ya exista en el registro para poder crearla (lo dice
#     `npm trust`: "The package you're configuring must already exist on the
#     npm registry"). O sea: la primera versión SIEMPRE sale con token.
#       1. npmjs.com → Access Tokens → Generate New Token → Granular Access
#          Token, con permiso de "Read and write" sobre paquetes.
#       2. GitHub → este repo → Settings → Secrets and variables → Actions
#          → New repository secret, con nombre NPM_TOKEN.
#       3. Actions → "Publicar CLI en npm" → Run workflow.
#
#     ⚠ EL PASO QUE SE OLVIDA: si tu cuenta tiene 2FA (y debería), el token
#     necesita ADEMÁS la casilla de saltarse el 2FA activada. Sin ella el
#     workflow llega hasta el final —arma el tarball, firma la procedencia— y
#     npm lo rechaza en el último segundo con:
#
#       403 Forbidden - PUT https://registry.npmjs.org/<paquete>
#       Two-factor authentication or granular access token with bypass 2fa
#       enabled is required to publish packages.
#
#     La alternativa, si prefieres no crear un token que se salte el 2FA (npm
#     los está restringiendo), es publicar la PRIMERA versión desde tu propia
#     máquina, escribiendo el código de 2FA a mano:
#
#       npm login && cd cli && npm publish --access public
#
#     Da igual cuál de las dos uses: en cuanto exista la v0.1.0 se pasa a OIDC
#     y no vuelve a hacer falta ningún token.
#
# A · Trusted Publishing (OIDC) — a lo que hay que llegar en cuanto exista la
#     v0.1.0: npm confía en este repositorio y NO hay ningún token guardado.
#     Nada que robar, nada que rotar. Dos formas de configurarlo:
#
#       npm trust github juancitoads \
#         --repo juanarrietabusiness-pixel/CRM-JuancitoADS \
#         --file publish-cli.yml
#
#     …o a mano en npmjs.com → paquete juancitoads → Settings → Trusted
#     Publisher, con esos mismos tres datos.
#
#     Hecho eso, BORRA el secret NPM_TOKEN. El workflow prefiere OIDC solo, y
#     un token que ya no hace falta es solo superficie de ataque.
#
# Cómo se dispara: a mano desde la pestaña Actions, o al publicar un release.
name: Publicar CLI en npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # prueba ante npm quién publica (OIDC) y firma la procedencia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing necesita npm 11.5.1 o superior.
      - name: Actualizar npm
        run: npm install -g npm@latest

      # El CLI no tiene dependencias: no hay install que hacer. Solo validamos
      # que el archivo que se va a publicar sea JavaScript sintácticamente sano.
      - name: Revisar el CLI
        working-directory: cli
        run: node --check bin/cli.js

      # Con Trusted Publishing configurado, npm ignora NODE_AUTH_TOKEN (vacío) y
      # usa OIDC. Sin él, cae al token del secret. El reintento sin --provenance
      # cubre el caso en que la firma no esté disponible para la combinación de
      # credenciales usada: preferimos publicar sin badge que no publicar.
      - name: Publicar
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --provenance \
            || npm publish --access public
