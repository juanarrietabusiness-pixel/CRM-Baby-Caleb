# CI y despliegue — un solo camino: probar → desplegar → auditar la verdad.
#
# Hasta el 23-sep-2026 eran dos workflows (ci.yml y este) disparados por el
# MISMO push a `main`: las pruebas corrían dos veces en paralelo, y el deploy
# publicaba sin esperar a css:check / icons:check, que solo estaban en CI. Ahora
# es una cadena: si las pruebas fallan, no se despliega; si se despliega, se
# audita la base EN VIVO contra el documento de la dueña.
#
# En un pull request solo corre `test` (el mismo nombre de siempre, así que
# cualquier regla de rama que lo exija sigue funcionando).
#
# Necesita estos secrets del repositorio (Settings → Secrets and variables →
# Actions):
#   CLOUDFLARE_API_TOKEN   — token de la cuenta donde vive el bot
#   CLOUDFLARE_ACCOUNT_ID  — id de esa misma cuenta
#   KB_REINDEX_TOKEN       — el MISMO valor que el secret del Worker; sin él la
#                            base de conocimiento no se actualiza al desplegar
#   WA_TOKEN               — opcional: el del canal de WhatsApp por QR
#
# `workflow_dispatch` permite dispararlo a mano desde la pestaña Actions
# eligiendo la rama — útil para probar antes de mergear a main.
name: CI y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1 · Probar ─────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      # Node 22, no 20: wrangler 4.x exige >= 22 y aborta con "Wrangler requires
      # at least Node.js v22.0.0" antes de hablar con Cloudflare. Las pruebas
      # corren en el mismo Node que publica.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # public/admin.css y public/icons.svg se versionan (wrangler sube public/
      # sin construir nada), así que aquí se comprueba que lo commiteado sea lo
      # que produce el código.
      - run: pnpm css:check
      - run: pnpm icons:check
      - run: pnpm test

  # ── 2 · Desplegar (solo main, o a mano) ───────────────────────────────────
  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Dos pushes seguidos no pueden desplegar en paralelo: el segundo espera, y
    # si llega un tercero mientras tanto, el del medio se descarta. Evita que
    # dos `wrangler deploy` se pisen y quede publicada la versión vieja.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # El esquema es idempotente (todo CREATE TABLE IF NOT EXISTS), así que
      # correrlo en cada deploy no toca los datos que ya existen: solo agrega
      # las tablas nuevas.
      - name: Aplicar el esquema a D1
        run: node scripts/db-apply.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # WA_TOKEN es el secreto compartido del canal de WhatsApp por QR: el
      # MISMO valor en el bot, en el puente y en el contenedor. El puente lo
      # carga en su propio Worker desde `puente-wa.yml`; este paso lo pone en el
      # Worker del bot, que es quien valida el webhook /webhooks/whatsapp-qr.
      #
      # Si no existe, NO se falla: el canal es alterno y opcional, y un bot sin
      # WhatsApp por QR sigue siendo un bot que hay que poder desplegar. La
      # tarjeta del panel dice "falta WA_TOKEN", que es diagnóstico suficiente.
      #
      # Tampoco se falla con un token inapto, por la misma razón — pero no se
      # carga: un token con tilde o eñe pasa toda prueba hecha por navegador y
      # falla solo en la máquina, con un 401 que no delata nada. Mejor que el
      # panel diga que falta a que diga que está y no funcione.
      - name: Guardar WA_TOKEN en el Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
        run: |
          if [ -z "$WA_TOKEN" ]; then
            echo "No hay secret WA_TOKEN en el repositorio — el canal de WhatsApp por QR queda sin configurar."
            exit 0
          fi
          largo=${#WA_TOKEN}
          if [ "$largo" -lt 24 ]; then
            echo "::warning::WA_TOKEN es demasiado corto ($largo, mínimo 24). No se cargó."
            exit 0
          fi
          if printf '%s' "$WA_TOKEN" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::warning::WA_TOKEN tiene caracteres fuera de ASCII imprimible. No se cargó."
            echo "Un token con tilde o enie pasa toda prueba por navegador y falla solo en la maquina."
            exit 0
          fi
          # Por stdin: así no aparece en la línea de comandos ni en el log.
          printf '%s' "$WA_TOKEN" | pnpm exec wrangler secret put WA_TOKEN

      # ci-deploy y no `pnpm run deploy`: el segundo dispara el hook predeploy,
      # que aborta si falta el secret DASHBOARD_PASSWORD. Ese chequeo tiene
      # sentido en la máquina de una persona, no en CI.
      - name: Desplegar el Worker
        run: node scripts/ci-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Desplegar NO actualiza lo que el bot sabe. Los textos de member/kb/
      # viajan dentro del Worker, pero el índice de Vectorize —que es lo que
      # searchKb consulta de verdad— solo cambia cuando alguien llama a esta
      # ruta. Sin este paso, el bot sigue contestando con el conocimiento
      # anterior después de un deploy correcto y en verde: la peor combinación,
      # porque todo parece bien.
      #
      # También es el paso que borra del índice los documentos retirados
      # (member/kb-retirados.json).
      - name: Reindexar la base de conocimiento
        env:
          KB_REINDEX_TOKEN: ${{ secrets.KB_REINDEX_TOKEN }}
        run: |
          if [ -z "$KB_REINDEX_TOKEN" ]; then
            echo "::error::Falta el secret KB_REINDEX_TOKEN del repositorio."
            echo "El Worker quedó desplegado, pero el bot sigue con el conocimiento anterior."
            echo ""
            echo "Cómo arreglarlo (todo desde el navegador):"
            echo "  1. Es el MISMO valor que el secret KB_REINDEX_TOKEN del Worker en Cloudflare."
            echo "  2. Aquí en GitHub: Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "  3. Nombre: KB_REINDEX_TOKEN. Valor: ese mismo token."
            echo "  4. Vuelva a lanzar este workflow desde la pestaña Actions."
            exit 1
          fi
          URL="$(grep -oP 'DASHBOARD_BASE_URL\s*=\s*"\K[^"]+' wrangler.toml)"
          if [ -z "$URL" ]; then
            echo "::error::No encontré DASHBOARD_BASE_URL en wrangler.toml."
            exit 1
          fi
          echo "Reindexando en $URL/kb/reindex"
          # --fail-with-body: sin esto curl devuelve 0 ante un 401 y el deploy
          # pasaría en verde con el índice sin tocar.
          RESP="$(curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 120 \
                    -X POST "$URL/kb/reindex" -H "X-Reindex-Token: $KB_REINDEX_TOKEN")"
          echo "$RESP"
          case "$RESP" in
            *'"ok":true'*) echo "Base de conocimiento actualizada." ;;
            *) echo "::error::El reindexado no confirmó ok:true."; exit 1 ;;
          esac

  # ── 3 · Auditar la verdad contra la base EN VIVO ──────────────────────────
  # Las pruebas vigilan los archivos; el bot lee D1. Justo después de publicar
  # es cuando más sirve mirar la base. Aquí es INFORMATIVA (un aviso, no un
  # rojo): los problemas que encuentra son de datos, no del código recién
  # desplegado. La corrida estricta es la de los lunes (auditar.yml).
  auditar:
    needs: deploy
    uses: ./.github/workflows/auditar.yml
    with:
      modo: informativo
    secrets: inherit
