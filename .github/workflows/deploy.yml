# Despliegue automático a Cloudflare.
#
# El deploy sale del repositorio, no del computador de nadie: cada push a
# `main` corre las pruebas y, si pasan, aplica el esquema y publica el Worker.
# Así no hay forma de que lo desplegado difiera de lo que está en git.
#
# Necesita dos secrets del repositorio (Settings → Secrets and variables →
# Actions):
#   CLOUDFLARE_API_TOKEN   — token de la cuenta donde vive el bot
#   CLOUDFLARE_ACCOUNT_ID  — id de esa misma cuenta
#   KB_REINDEX_TOKEN       — el MISMO valor que el secret del Worker; sin él la
#                            base de conocimiento no se actualiza al desplegar
#
# `workflow_dispatch` permite dispararlo a mano desde la pestaña Actions
# eligiendo la rama — útil para probar antes de mergear a main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos pushes seguidos no pueden desplegar en paralelo: el segundo espera, y si
# llega un tercero mientras tanto, el del medio se descarta. Evita que dos
# `wrangler deploy` se pisen y quede publicada la versión vieja.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      # Node 22, no 20: wrangler 4.x exige >= 22 y aborta con "Wrangler requires
      # at least Node.js v22.0.0" antes de hablar con Cloudflare. Como
      # package.json trae wrangler en "latest", esto sube solo — el piso lo
      # pone wrangler, no nosotros.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Las pruebas son el candado: nada roto llega a producción.
      - run: pnpm typecheck
      - run: pnpm test

      # El esquema es idempotente (todo CREATE TABLE IF NOT EXISTS), así que
      # correrlo en cada deploy no toca los datos que ya existen: solo agrega
      # las tablas nuevas.
      - name: Aplicar el esquema a D1
        run: node scripts/db-apply.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ci-deploy y no `pnpm run deploy`: el segundo dispara el hook predeploy,
      # que aborta si falta el secret DASHBOARD_PASSWORD. Ese chequeo tiene
      # sentido en la máquina de una persona, no en CI.
      - name: Desplegar el Worker
        run: node scripts/ci-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Desplegar NO actualiza lo que el bot sabe. Los textos de member/kb/
      # viajan dentro del Worker, pero el índice de Vectorize —que es lo que
      # searchKb consulta de verdad— solo cambia cuando alguien llama a esta
      # ruta. Sin este paso, el bot sigue contestando con el conocimiento
      # anterior después de un deploy correcto y en verde: la peor combinación,
      # porque todo parece bien.
      #
      # También es el paso que borra del índice los documentos retirados
      # (member/kb-retirados.json).
      - name: Reindexar la base de conocimiento
        env:
          KB_REINDEX_TOKEN: ${{ secrets.KB_REINDEX_TOKEN }}
        run: |
          if [ -z "$KB_REINDEX_TOKEN" ]; then
            echo "::error::Falta el secret KB_REINDEX_TOKEN del repositorio."
            echo "El Worker quedó desplegado, pero el bot sigue con el conocimiento anterior."
            echo ""
            echo "Cómo arreglarlo (todo desde el navegador):"
            echo "  1. Es el MISMO valor que el secret KB_REINDEX_TOKEN del Worker en Cloudflare."
            echo "  2. Aquí en GitHub: Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "  3. Nombre: KB_REINDEX_TOKEN. Valor: ese mismo token."
            echo "  4. Vuelva a lanzar este workflow desde la pestaña Actions."
            exit 1
          fi
          URL="$(grep -oP 'DASHBOARD_BASE_URL\s*=\s*"\K[^"]+' wrangler.toml)"
          if [ -z "$URL" ]; then
            echo "::error::No encontré DASHBOARD_BASE_URL en wrangler.toml."
            exit 1
          fi
          echo "Reindexando en $URL/kb/reindex"
          # --fail-with-body: sin esto curl devuelve 0 ante un 401 y el deploy
          # pasaría en verde con el índice sin tocar.
          RESP="$(curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 120 \
                    -X POST "$URL/kb/reindex" -H "X-Reindex-Token: $KB_REINDEX_TOKEN")"
          echo "$RESP"
          case "$RESP" in
            *'"ok":true'*) echo "Base de conocimiento actualizada." ;;
            *) echo "::error::El reindexado no confirmó ok:true."; exit 1 ;;
          esac
